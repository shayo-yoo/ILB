name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 单元测试
        run: |
          node --test tests/core.test.mjs tests/flow.test.mjs tests/search.test.mjs \
            tests/snapshot.test.mjs tests/import-plan.test.mjs tests/ui-layout.test.mjs

      # v0.28.0：对外接口是契约，接口与关联的用例也进 CI（以前只在本地跑）
      - name: 接口与关联单测
        run: node --test tests/api.test.mjs tests/api-worldbooks.test.mjs tests/bindings.test.mjs

      - name: 模块链接检查
        run: node tests/linkcheck.mjs

      - name: 界面冒烟（假 DOM）
        run: node tests/smoke-dom.mjs
