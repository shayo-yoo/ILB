name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 单元测试
        run: |
          node --test tests/core.test.mjs tests/flow.test.mjs tests/search.test.mjs \
            tests/snapshot.test.mjs tests/import-plan.test.mjs tests/ui-layout.test.mjs

      - name: 模块链接检查
        run: node tests/linkcheck.mjs

      - name: 界面冒烟（假 DOM）
        run: node tests/smoke-dom.mjs
