<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ILB 双壳路由探针（内层）</title>
    <style>
      html, body { margin: 0; padding: 0; background: #14141a; color: #eaeaea; font: 14px/1.5 system-ui, sans-serif; }
      #chat { height: 100%; overflow: auto; padding: 8px; }
      p { margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <div id="chat"><p>王城的钟声在黄昏响起。</p></div>
    <script type="module">
      // 验证"运行时真的走了壳"：index.js 装的就是 createShell，不是某一个壳。
      // 手机分支必须让电脑那套整体消失、电脑分支必须让手机那套消失；
      // 提示也必须落在当前看得见的那套界面里（top layer 会把宿主 toastr 压在下面）。
      const params = new URLSearchParams(location.search);
      const lines = [];
      const errors = [];
      const note = (ok, text) => lines.push({ ok, text });
      window.addEventListener('error', (e) => errors.push(String(e.message ?? e.error ?? 'error')));
      window.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason?.message ?? e.reason)));

      if (params.get('nocss') !== '1') {
        await new Promise((resolve) => {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '../style.css';
          link.onload = resolve;
          link.onerror = resolve;
          document.head.appendChild(link);
        });
      }

      const { createRepository } = await import('../adapters/repository.js');
      const { createRegistry } = await import('../runtime/registry.js');
      const { createPipeline } = await import('../runtime/pipeline.js');
      const { createPanel } = await import('../ui/panel.js');
      const { createShell } = await import('../ui/shell.js');
      const { pickLayout, viewportOf, describeLayout } = await import('../ui/layout.js');

      const buckets = { settings: {}, books: {}, manualState: {}, chatStates: {}, importLog: [], snapshots: [], ui: {} };
      const repository = createRepository({ getContext: () => ({ extensionSettings: { independent_lorebook: buckets } }) });
      repository.saveBook({
        book_id: 'book-route',
        name: '王城秘史',
        activation: { mode: 'always', characters: [], manual: true },
        pool: { share: true },
        entries: [{ id: 'e1', title: '王城', content: '王城的钟声', enabled: true, trigger: { any: ['王城'] } }],
      });
      const notifyLog = [];
      const nativeWorlds = { list: async () => [], get: async () => null, isAvailable: () => true };
      const pipeline = createPipeline({ repository, injector: { apply: () => true, clear() {} }, registry: createRegistry() });
      const panel = createPanel({ repository, nativeWorlds, pipeline, notify: (m, k) => notifyLog.push(`${k}:${m}`) });
      const shell = createShell({ repository, notify: (m, k) => notifyLog.push(`${k}:${m}`), onOpen: () => panel.render() });
      const ready = shell.mount();
      const attached = ready ? await shell.attachPanel(panel) : false;

      const viewport = viewportOf();
      const expect = params.get('expect') ?? 'mobile';
      const actual = pickLayout(viewport);
      const shown = (node) => {
        if (!node) return 'missing';
        const cs = getComputedStyle(node);
        return `${cs.display}/${cs.visibility}`;
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      note(ready === true && attached === true, `壳挂上了（mount=${ready} attachPanel=${attached}）`);
      note(actual === expect, `布局判定：${describeLayout(actual)}（视口 ${viewport.width}×${viewport.height}，期望 ${describeLayout(expect)}）`);
      note(shell.layout() === actual, `shell.layout()=${shell.layout()} 与判定一致`);

      const mobileFab = document.querySelector('.ilb-m-fab');
      const desktopFab = document.querySelector('.ilb-fab');
      if (actual === 'mobile') {
        note(mobileFab && getComputedStyle(mobileFab).display !== 'none', `手机悬浮球在场（display=${shown(mobileFab)}）`);
        note(!desktopFab || getComputedStyle(desktopFab).display === 'none', `电脑悬浮球让位（display=${shown(desktopFab)}）`);
        note(!document.querySelector('.ilb-window.ilb-window-open'), '电脑浮窗没有同时打开');
        mobileFab.click();
        await wait(120);
        const dialog = document.querySelector('dialog.ilb-m');
        note(dialog?.open === true, `点手机悬浮球后 dialog open=${dialog?.open}`);
        note(document.querySelector('.ilb-m-panel .ilb-root') !== null, '面板被挂进了手机壳里');
        shell.notify('测试提示', 'info');
        await wait(60);
        note(document.querySelector('.ilb-m-toasts .ilb-m-toast') !== null, 'shell.notify 落进了手机界面自己的提示条（top layer 里面看得见）');
      } else {
        note(desktopFab && getComputedStyle(desktopFab).display !== 'none', `电脑悬浮球在场（display=${shown(desktopFab)}）`);
        note(!mobileFab || getComputedStyle(mobileFab).display === 'none', `手机悬浮球让位（display=${shown(mobileFab)}）`);
        note(!document.querySelector('dialog.ilb-m[open]'), '手机整屏界面没有同时打开');
        // 电脑那套的悬浮球开合走 pointerdown/up（要区分拖动），合成指针事件在无头环境里
        // 拿不到 pointer capture；这里直接走壳的 open()——设置卡片的按钮也是这条路。
        shell.open();
        await wait(120);
        const win = document.querySelector('.ilb-window');
        note(win && getComputedStyle(win).display !== 'none', `shell.open() 之后浮窗打开（display=${shown(win)}）`);
        note(document.querySelector('.ilb-window .ilb-root') !== null, '面板被挂进了电脑浮窗里');
      }
      shell.close();
      await wait(80);

      window.__ILB_PROBE_REPORT = {
        tag: `${viewport.width}×${viewport.height}（期望${expect === 'mobile' ? '手机' : '电脑'}）`,
        lines: lines.map((l) => `${l.ok ? 'PASS' : 'FAIL'} ${l.text}`),
        notes: [`notify=${notifyLog.join(' | ') || '（无）'}`],
        errors,
        ok: lines.every((l) => l.ok) && errors.length === 0,
      };
    </script>
  </body>
</html>
